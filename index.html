<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tPS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>The Personal System</h1>
        <p>A personal operating system for learning, building, and living.</p>

        <button id="theme-toggle" type="button">
            🌙 Dark Mode
        </button>
    </header>
    <main>
        <section>
            <h2>What is it all about?</h2>
            <ul>
                <li><a href="#">AutoTech</a></li>
                <li><a href="#">AutoAcademia</a></li>
                <li><a href="#">AutoGit</a></li>
                <li><a href="#">AutoCode</a></li>
                <li><a href="autox.html">AutoX</a></li>
                <li><a href="#">Auto+</a></li>
                <li><a href="#">AutoFund</a></li>
            </ul>
        </section>
    </main>
    <footer>
        <p>Since July 2023</p>
    </footer>
    <script>
        const toggleButton = document.getElementById("theme-toggle");

        // Load saved theme
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "dark") {
            document.body.classList.add("dark-mode");
            toggleButton.textContent = "☀️ Light Mode";
        }

        toggleButton.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");

            const isDark = document.body.classList.contains("dark-mode");

            if (isDark) {
                toggleButton.textContent = "☀️ Light Mode";
                localStorage.setItem("theme", "dark");
            } else {
                toggleButton.textContent = "🌙 Dark Mode";
                localStorage.setItem("theme", "light");
            }
        });
    </script>
</body>
</html>
